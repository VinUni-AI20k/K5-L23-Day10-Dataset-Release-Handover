let currentFilter = 'all';
let showBoxes = true;
let reviewState = JSON.parse(localStorage.getItem('review_de_an_10') || '{}');

function renderGrid() {
  const grid = document.getElementById('imageGrid');
  grid.innerHTML = '';
  
  let displayed = 0;
  IMAGES.forEach((item, idx) => {
    const hasCand = item.candidates && item.candidates.length > 0;
    const hasRule = !!item.rule_fault;
    const candTypes = (item.candidates || []).map(c => c.type);
    
    // Filter matching
    if (currentFilter === 'cands' && !hasCand) return;
    if (currentFilter === 'rules' && !hasRule) return;
    if (currentFilter === 'class_swap' && !candTypes.includes('class_swap')) return;
    if (currentFilter === 'bbox_drift' && !candTypes.includes('bbox_drift')) return;
    if (currentFilter === 'missing_box' && !candTypes.includes('missing_box')) return;
    
    displayed++;
    
    const card = document.createElement('div');
    card.className = "bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow transition flex flex-col";
    
    // Header
    let badgeHtml = '';
    if (hasRule) {
      badgeHtml += `<span class="px-2 py-0.5 bg-red-100 text-red-700 font-bold rounded text-xs">Luật: ${item.rule_fault}</span>`;
    }
    if (hasCand) {
      item.candidates.forEach(c => {
        badgeHtml += `<span class="px-2 py-0.5 bg-amber-100 text-amber-800 font-bold rounded text-xs ml-1">${c.type}</span>`;
      });
    }
    
    const saved = reviewState[item.id] || { verdict: '', note: '' };
    
    card.innerHTML = `
      <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div>
          <span class="font-bold text-slate-900 mono">${item.id}</span>
          <span class="text-xs text-slate-500 ml-2">Scene: ${item.meta.scene_id || '—'} &bull; Job: ${item.meta.job_id || '—'}</span>
        </div>
        <div class="flex items-center gap-1">${badgeHtml}</div>
      </div>
      
      <!-- Image Canvas View -->
      <div class="relative bg-slate-900 flex items-center justify-center overflow-hidden aspect-[4/3] group">
        ${item.has_img ? `
          <img src="${item.src}" id="img_${item.id}" class="max-h-full max-w-full object-contain" onload="drawBoxes('${item.id}')" />
          <canvas id="cvs_${item.id}" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
        ` : `
          <div class="text-rose-400 font-bold text-sm">❌ Missing Image File (missing_image)</div>
        `}
      </div>
      
      <!-- Details & Candidates Info -->
      <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
        <div>
          <div class="text-xs text-slate-600 mb-2">
            <span class="font-semibold text-slate-800">Box YOLO:</span> ${item.boxes.map(b => `<span class="inline-block px-1.5 py-0.5 bg-slate-100 border text-slate-700 rounded mr-1 mono">${b.cls_name}</span>`).join('') || '<span class="italic text-slate-400">Không có box</span>'}
          </div>
          ${hasCand ? `
            <div class="p-2.5 bg-amber-50 rounded-lg border border-amber-200 text-xs text-amber-900 space-y-1">
              <div class="font-bold flex items-center gap-1 text-amber-800">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                Đối chiếu Panoptic phát hiện:
              </div>
              ${item.candidates.map(c => `<div>&bull; <strong class="mono">${c.type}</strong>: ${c.details || (c.det_class + ' vs ' + c.pan_class)}</div>`).join('')}
            </div>
          ` : ''}
        </div>
        
        <!-- Review Action Bar -->
        <div class="pt-2 border-t border-slate-100">
          <div class="flex items-center gap-4 text-xs font-semibold mb-2">
            <label class="flex items-center gap-1.5 cursor-pointer text-emerald-700">
              <input type="radio" name="verdict_${item.id}" value="confirmed" ${saved.verdict === 'confirmed' ? 'checked' : ''} onchange="updateReview('${item.id}', 'confirmed')">
              <span>Confirmed (Xác nhận lỗi)</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer text-slate-500">
              <input type="radio" name="verdict_${item.id}" value="rejected" ${saved.verdict === 'rejected' ? 'checked' : ''} onchange="updateReview('${item.id}', 'rejected')">
              <span>Rejected (Lệch tự nhiên/Đúng)</span>
            </label>
          </div>
          <input type="text" id="note_${item.id}" value="${saved.note || ''}" placeholder="Ghi chú quan sát thực tế (≥ 20 ký tự)..." onchange="updateNote('${item.id}')" class="w-full text-xs px-2.5 py-1.5 rounded border border-slate-300 focus:outline-none focus:border-rose-500 font-sans" />
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  
  document.getElementById('counterText').innerText = `Hiển thị ${displayed}/${IMAGES.length} ảnh`;
}

function drawBoxes(imgId) {
  const item = IMAGES.find(it => it.id === imgId);
  if (!item || !showBoxes) return;
  const img = document.getElementById(`img_${imgId}`);
  const cvs = document.getElementById(`cvs_${imgId}`);
  if (!img || !cvs) return;
  
  cvs.width = cvs.clientWidth;
  cvs.height = cvs.clientHeight;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  
  // Calculate image scale & offset inside container (object-contain)
  const nw = img.naturalWidth || 640;
  const nh = img.naturalHeight || 480;
  const cw = cvs.width;
  const ch = cvs.height;
  const scale = Math.min(cw / nw, ch / nh);
  const ox = (cw - nw * scale) / 2;
  const oy = (ch - nh * scale) / 2;
  
  item.boxes.forEach(b => {
    const x = ox + (b.x - b.w / 2) * nw * scale;
    const y = oy + (b.y - b.h / 2) * nh * scale;
    const w = b.w * nw * scale;
    const h = b.h * nh * scale;
    
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#e11d48'; // crimson
    ctx.strokeRect(x, y, w, h);
    
    ctx.fillStyle = '#e11d48';
    ctx.font = 'bold 11px Plus Jakarta Sans, sans-serif';
    const tag = b.cls_name;
    const tw = ctx.measureText(tag).width + 6;
    ctx.fillRect(x, Math.max(0, y - 16), tw, 16);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(tag, x + 3, Math.max(12, y - 4));
  });
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    if (btn.dataset.filter === filter) {
      btn.className = "filter-btn px-2.5 py-1 rounded bg-rose-600 text-white font-medium";
    } else {
      btn.className = "filter-btn px-2.5 py-1 rounded bg-white text-slate-700 border hover:bg-slate-50 font-medium";
    }
  });
  renderGrid();
  setTimeout(() => {
    IMAGES.forEach(it => drawBoxes(it.id));
  }, 100);
}

function toggleBoxOverlay() {
  showBoxes = !showBoxes;
  document.getElementById('toggleBoxBtn').innerText = showBoxes ? 'Ẩn Bounding Box' : 'Hiện Bounding Box';
  IMAGES.forEach(it => {
    const cvs = document.getElementById(`cvs_${it.id}`);
    if (cvs) {
      if (showBoxes) drawBoxes(it.id);
      else cvs.getContext('2d').clearRect(0, 0, cvs.width, cvs.height);
    }
  });
}

function updateReview(id, verdict) {
  reviewState[id] = reviewState[id] || {};
  reviewState[id].verdict = verdict;
  
  // Auto suggest note if empty
  const noteInput = document.getElementById(`note_${id}`);
  if (!noteInput.value.trim()) {
    const it = IMAGES.find(x => x.id === id);
    if (verdict === 'confirmed') {
      const firstCand = (it.candidates || [])[0];
      if (firstCand) {
        noteInput.value = `Quan sát thực tế trong ảnh: ${firstCand.details || firstCand.type} đã được xác nhận chính xác.`;
      } else {
        noteInput.value = `Ảnh ${id} phát hiện lỗi gán nhãn không khớp thực tế.`;
      }
    } else {
      noteInput.value = `Ảnh ${id} vật thể bị che khuất một phần, chênh lệch tự nhiên giữa 2 nguồn.`;
    }
    reviewState[id].note = noteInput.value;
  }
  localStorage.setItem('review_de_an_10', JSON.stringify(reviewState));
}

function updateNote(id) {
  const noteInput = document.getElementById(`note_${id}`);
  reviewState[id] = reviewState[id] || {};
  reviewState[id].note = noteInput.value.trim();
  localStorage.setItem('review_de_an_10', JSON.stringify(reviewState));
}

function exportReviewCSV() {
  let rows = [["image", "type", "verdict", "note"]];
  Object.keys(reviewState).forEach(id => {
    const it = IMAGES.find(x => x.id === id);
    const r = reviewState[id];
    if (r.verdict) {
      const type = (it && it.candidates && it.candidates[0]) ? it.candidates[0].type : "class_swap";
      rows.push([id, type, r.verdict, r.note || ""]);
    }
  });
  
  const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.map(cell => `"${cell.replace(/"/g, '""')}"`).join(",")).join("\n");
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "review_log.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

window.addEventListener('resize', () => {
  IMAGES.forEach(it => drawBoxes(it.id));
});

renderGrid();
</script>
